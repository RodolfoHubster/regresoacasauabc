<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Regresa a Casa UABC</title>
  
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-body">

  <div class="login-card">
    <header class="login-header">
      <img src="../assets/images/AlumniTransparente.png" alt="UABC Alumni" class="login-logo">
      <h1 class="login-title">Regresa a Casa</h1>
      <p class="login-subtitle">Panel Admin</p>
    </header>

    <div id="error-alert" class="error-msg">
      Correo o contraseña incorrectos.
    </div>

    <form action="php/validar_login.php" method="POST">
      <div class="form-group">
        <label for="correo" class="form-label">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" class="form-input" placeholder="admin@uabc.edu.mx" required>
      </div>

      <div class="form-group" style="margin-top: var(--space-4);">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-6); justify-content: center;">
        Iniciar Sesión
      </button>
    </form>

    <footer class="login-footer">
      <a href="../index.html" class="login-back-link">← Volver al inicio</a>
    </footer>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      document.getElementById('error-alert').style.display = 'block';
    }
  </script>
</body>
</html>
